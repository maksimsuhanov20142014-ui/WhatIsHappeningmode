name: Build WhatIsHappening
on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Create project files
        shell: bash
        run: |

          mkdir -p "$(dirname 'build.gradle')"
          echo '' | base64 -d > 'build.gradle'
          mkdir -p "$(dirname 'settings.gradle')"
          echo '' | base64 -d > 'settings.gradle'
          mkdir -p "$(dirname 'gradle.properties')"
          echo 'b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyRwptaW5lY3JhZnRfdmVyc2lvbj0xLjIxLjEKeWFybl9tYXBwaW5ncz0xLjIxLjErYnVpbGQuMwpsb2FkZXJfdmVyc2lvbj0wLjE2LjE0CmZhYnJpY192ZXJzaW9uPTAuMTE2LjE1KzEuMjEuMQptb2RfdmVyc2lvbj0xLjAuMAptYXZlbl9ncm91cD1jb20ud2hhdGhhcHBlbmluZwphcmNoaXZlc19iYXNlX25hbWU9d2hhdC1pcy1oYXBwZW5pbmcK' | base64 -d > 'gradle.properties'
          mkdir -p "$(dirname 'src/main/java/com/whathappening/client/WhatIsHappeningClient.java')"
          echo '' | base64 -d > 'src/main/java/com/whathappening/client/WhatIsHappeningClient.java'
          mkdir -p "$(dirname 'src/main/java/com/whathappening/client/mixin/LivingEntityTotemSoundMixin.java')"
          echo '' | base64 -d > 'src/main/java/com/whathappening/client/mixin/LivingEntityTotemSoundMixin.java'
          mkdir -p "$(dirname 'src/main/resources/fabric.mod.json')"
          echo '' | base64 -d > 'src/main/resources/fabric.mod.json'
          mkdir -p "$(dirname 'src/main/resources/whathappening.mixins.json')"
          echo 'ewogICJyZXF1aXJlZCI6IHRydWUsCiAgInBhY2thZ2UiOiAiY29tLndoYXRoYXBwZW5pbmcuY2xpZW50Lm1peGluIiwKICAiY29tcGF0aWJpbGl0eUxldmVsIjogIkpBVkFfMjEiLAogICJjbGllbnQiOiBbIkxpdmluZ0VudGl0eVRvdGVtU291bmRNaXhpbiJdLAogICJpbmplY3RvcnMiOiB7CiAgICAiZGVmYXVsdFJlcXVpcmUiOiAxCiAgfQp9Cg==' | base64 -d > 'src/main/resources/whathappening.mixins.json'
          mkdir -p "$(dirname 'src/main/resources/assets/whathappening/sounds.json')"
          echo 'ewogICJ3aGF0X2lzX2hhcHBlbmluZyI6IHsKICAgICJzb3VuZHMiOiBbCiAgICAgIHsKICAgICAgICAibmFtZSI6ICJ3aGF0aGFwcGVuaW5nOndoYXRfaXNfaGFwcGVuaW5nIiwKICAgICAgICAic3RyZWFtIjogdHJ1ZQogICAgICB9CiAgICBdCiAgfQp9Cg==' | base64 -d > 'src/main/resources/assets/whathappening/sounds.json'
          mkdir -p "$(dirname 'src/main/resources/assets/whathappening/sounds/what_is_happening.ogg')"
          echo '' | base64 -d > 'src/main/resources/assets/whathappening/sounds/what_is_happening.ogg'
          mkdir -p "$(dirname 'src/main/resources/assets/minecraft/textures/item/totem_of_undying.png')"
          echo '' | base64 -d > 'src/main/resources/assets/minecraft/textures/item/totem_of_undying.png'
          mkdir -p "$(dirname 'LICENSE')"
          echo '' | base64 -d > 'LICENSE'
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build JAR
        run: gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: WhatIsHappening-1.21.1
          path: build/libs/*.jar
          if-no-files-found: error
